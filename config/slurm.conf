# Slurm 25.11.7 single-node baseline generated from slurmd -C on 2026-08-04.
ClusterName=h100
SlurmctldHost=sagsh100server
SlurmUser=slurm
SlurmdUser=root
AuthType=auth/munge
PluginDir=/usr/lib/x86_64-linux-gnu/slurm

SlurmctldPort=6817
SlurmdPort=6818
SlurmctldPidFile=/run/slurmctld/slurmctld.pid
SlurmdPidFile=/run/slurm/slurmd.pid
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info
LogTimeFormat=iso8601_ms
MailProg=/usr/bin/true

SlurmctldParameters=enable_configless
ReturnToService=2
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
GresTypes=gpu

ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=30

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=sagsh100server
AccountingStoragePort=6819
AccountingStorageEnforce=associations,limits,qos,safe
AccountingStorageTRES=gres/gpu

PriorityType=priority/multifactor
PriorityDecayHalfLife=7-00:00:00
PriorityWeightAge=1000
PriorityWeightFairshare=10000
PriorityWeightJobSize=1000
PriorityWeightQOS=10000

NodeName=sagsh100server CPUs=256 Boards=1 SocketsPerBoard=2 CoresPerSocket=64 ThreadsPerCore=2 RealMemory=486377 Gres=gpu:h100:4 State=UNKNOWN

PartitionName=notebook Nodes=sagsh100server Default=YES DefaultTime=01:00:00 MaxTime=08:00:00 DefMemPerCPU=1800 State=UP
PartitionName=train Nodes=sagsh100server Default=NO DefaultTime=01:00:00 MaxTime=7-00:00:00 DefMemPerCPU=1800 State=UP
