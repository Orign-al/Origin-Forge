# Per-UID storage on the dedicated XFS platform filesystem.
ENROOT_CACHE_PATH          /srv/gpu-platform/enroot/cache/${UID}
ENROOT_DATA_PATH           /srv/gpu-platform/enroot/data/${UID}
ENROOT_RUNTIME_PATH        /srv/gpu-platform/enroot/runtime/${UID}
ENROOT_TEMP_PATH           ${TMPDIR:-/tmp}

# Explicit conservative defaults; Pyxis users can request root remapping per job.
ENROOT_MOUNT_HOME          no
ENROOT_REMAP_ROOT          no
ENROOT_ALLOW_SUPERUSER     no
ENROOT_ALLOW_HTTP          no
